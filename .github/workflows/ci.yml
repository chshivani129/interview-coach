name: Interview Coach CI

on:
  push:
    branches: [main, feature-branch]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coach
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
        ports:
          - 5433:5432
        options: >-          
          --health-cmd "pg_isready -U coach -d coach"          
          --health-interval 10s        
          --health-timeout 5s          
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5433/coach
          DB_USERNAME: coach
          DB_PASSWORD: coach
        run: ./gradlew clean build

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build