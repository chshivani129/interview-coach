spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/coach}
    username: ${DB_USERNAME:coach}
    password: ${DB_PASSWORD:coach}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

ai:
  provider: gemini
  api-key: ${AI_API_KEY:}