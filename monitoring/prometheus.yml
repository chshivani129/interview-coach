global:
  scrape_interval: 15s

scrape_configs:
  # Local Spring Boot backend
  - job_name: coach-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # Deployed Spring Boot backend on Render
  - job_name: interview-coach-production
    metrics_path: /actuator/prometheus
    scrape_interval: 60s
    scrape_timeout: 30s
    scheme: https
    static_configs:
      - targets: ["interview-coach-ad04.onrender.com"]

remote_write:
  - url: "https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push"
    basic_auth:
      username: "3754308"
      password_file: /etc/prometheus/grafana-cloud-token